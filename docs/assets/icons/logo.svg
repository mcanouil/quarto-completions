<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-labelledby="quarto-completions-logo-title">
  <title id="quarto-completions-logo-title">Quarto Completions</title>
  <!-- The same mark as icon.svg, drawn only in the dark variant. This one is
       the brand logo, which Quarto puts in the navbar, and the navbar is
       graphite in both colour schemes (see the chrome defaults in
       ../../_brand.yml). A scheme-adaptive mark would draw its ink panes there
       in the light scheme and disappear, so the colours are fixed: ash panes
       and a phosphor suggestion. See icon.svg for the geometry. -->
  <path fill="#DCE5DE" d="M15.1 3.03A13 13 0 0 0 3.03 15.1H15.1Z"/>
  <path fill="#DCE5DE" d="M16.9 3.03A13 13 0 0 1 28.97 15.1H16.9Z"/>
  <path fill="#DCE5DE" d="M3.03 16.9A13 13 0 0 0 15.1 28.97V16.9Z"/>
  <path fill="none" stroke="#4FCB84" d="M17.9 17.9H27.85A12 12 0 0 1 17.9 27.85Z" stroke-width="2" stroke-dasharray="2.4 2.2" stroke-linecap="round"/>
</svg>
