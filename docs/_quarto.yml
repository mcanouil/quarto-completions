project:
  type: atelier
  render:
    - index.qmd
    - shells.qmd
    - troubleshooting.qmd
    - 404.qmd
  # Quarto copies nothing to the output directory by convention: only these
  # globs, plus files it finds behind an `href` or `src` in the rendered HTML.
  # The installers and the generated completions are fetched by URL rather than
  # linked from a page, and the manifest names its icons in JSON, which is not
  # scanned, so they are all listed here.
  resources:
    - install.sh
    - install.ps1
    - completions/**
    - favicon.ico
    - site.webmanifest
    - assets/icons/*.png
    - assets/social/og-image.png

website:
  title: "Quarto Completions"
  description: "Shell completions for the Quarto CLI: bash, zsh, fish, and PowerShell, with a one-line installer."
  # No trailing slash: Quarto builds the social image URL by concatenating this
  # with a leading-slash image path, without normalising.
  site-url: &site-url "https://m.canouil.dev/quarto-completions"
  repo-url: https://github.com/mcanouil/quarto-completions
  # The Quarto project root is docs/, so the edit and issue links atelier turns
  # on need the subdirectory; without it they point at the repository root
  # and 404.
  repo-subdir: docs
  favicon: favicon.ico
  # The leading slash marks a project-relative path, which Quarto turns into
  # `<site-url>/assets/social/og-image.png` and measures to fill the image width
  # and height tags. The card inherits into both Open Graph and the Twitter
  # card, which atelier switches on; no `creator` or `site` handles, since there
  # is no X account to name.
  image: /assets/social/og-image.png
  image-alt: "The Quarto Completions mark, a circle of four quadrants with the fourth drawn as a dashed green outline, above the words quarto completions on a near-black background."
  page-footer:
    left: |
      Powered by [{{< iconify simple-icons:quarto title="Quarto Logo" label="Quarto Logo" >}} Quarto](https://quarto.org).
    center: |
      &copy; []{#current-year} [Mickaël CANOUIL](https://mickael.canouil.fr). [{{< iconify octicon:heart-fill-16 title="Heart" label="Heart" >}} Sponsor](https://github.com/sponsors/mcanouil?o=esb).
    right: |
      Licence: [MIT](https://github.com/mcanouil/quarto-completions?tab=MIT-1-ov-file#readme).
  navbar:
    left:
      - text: "{{< iconify octicon:download-16 title='Install' label='Install' >}} Install"
        href: index.qmd
      - text: "{{< iconify octicon:terminal-16 title='Shells' label='Shells' >}} Shells"
        href: shells.qmd
      - text: "{{< iconify octicon:question-16 title='Troubleshooting' label='Troubleshooting' >}} Troubleshooting"
        href: troubleshooting.qmd
    right:
      - href: "#gitlink-widget"
        aria-label: "GitHub"

brand: _brand.yml

# The `atelier` project type sets `format: atelier-html`. Declaring `html` here
# would replace that format rather than configure it, silently dropping the
# accessibility scripts, `lang: en-GB`, the colour-scheme handling, and the
# extension stylesheet. The theme lists below extend the format's own, which is
# why the project layer wins the cascade. They are written out twice rather than
# shared through a YAML anchor, which the schema check rejects.
format:
  atelier-html:
    theme:
      light:
        - brand
        - assets/stylesheets/theme.scss
      dark:
        - brand
        - assets/stylesheets/theme.scss

filters:
  - at: pre-quarto
    path: code-window
  - at: post-quarto
    path: gitlink

extensions:
  atelier:
    # Quarto keeps the `website` block out of the metadata it hands to Lua
    # filters, so atelier's social-metadata filter cannot read
    # `website.site-url` to build the canonical URL. The anchor above
    # republishes the same scalar here, without a second copy of the string.
    site-url: *site-url
    icon: assets/icons/icon.svg
    apple-touch-icon: assets/icons/apple-touch-icon.png
    manifest: site.webmanifest
    # `theme-color` is left out: it falls back to `color.background` of
    # _brand.yml for each scheme, which is already what this site wants.
  gitlink:
    # Widget only: the platform and repository come from `website.repo-url`,
    # and in-text reference rewriting stays off so prose is left alone.
    enabled: false
    widget:
      enabled: true
      extra-links:
        - text: "Ideas / Feature Requests"
          href: "/discussions/categories/ideas"
          icon: discussion
        - text: "Q&A"
          href: "/discussions/categories/q-a"
          icon: question
      sponsor: mcanouil
      style-navbar-tools: true
  # code-window is left on its defaults: the macOS style, and a filename
  # derived from the language. Every block here is a shell command, so that
  # label reads as the shell it belongs to, which is exactly the distinction
  # this site is about.
