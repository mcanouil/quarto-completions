name: Release

on:
  workflow_dispatch:
    inputs:
      quarto:
        type: choice
        description: "Quarto version"
        default: "release"
        options:
          - "release"
          - "pre-release"

permissions:
  contents: read

jobs:
  release:
    uses: mcanouil/quarto-workflows/.github/workflows/release.yml@v1
    permissions:
      contents: write
      pull-requests: write
      pages: write
      id-token: write
    secrets: inherit
    with:
      gh-app-id: ${{ vars.APP_ID }}
      repo-type: project
      quarto: ${{ inputs.quarto || 'release' }}

  # The reusable workflow above builds a project-type release with no
  # install section of its own: its "## Installation" block only fires for
  # repo-type: extension, and it exposes no output this job could react to
  # before it runs `gh release create`. So this prepends one after the fact,
  # onto the release it just made, the same way .github/release-notes.md is
  # used in mcanouil/oboro and mcanouil/minato. Editing an existing release
  # triggers no further workflow, so the default GITHUB_TOKEN is enough; no
  # App-token dance like the reusable workflow's own bump-version job needs.
  add-install-section:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepend the Install section to the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name)"
          sed "s/%%VERSION%%/${TAG}/g" .github/release-notes.md > notes.md
          echo "" >> notes.md
          gh release view "${TAG}" --json body --jq .body >> notes.md
          gh release edit "${TAG}" --notes-file notes.md

  # The completions themselves, so a release can be installed offline or
  # pinned by hand. The installers are unaffected: they always read the
  # published site, never a release asset. Two archives of one tree rather
  # than a file per channel, since every channel holds a file named _quarto.
  upload-completions:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Attach the completions to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name)"
          # The checkout above is of the branch this ran from, which is behind
          # the tag by the version bump the reusable workflow just committed.
          git fetch --depth 1 origin "refs/tags/${TAG}:refs/tags/${TAG}"
          git checkout "${TAG}" -- docs/completions
          tar -czf "quarto-completions-${TAG}.tar.gz" -C docs completions
          (cd docs && zip -qr "../quarto-completions-${TAG}.zip" completions)
          # --clobber, so re-running this job over a release is not fatal.
          gh release upload "${TAG}" \
            "quarto-completions-${TAG}.tar.gz" \
            "quarto-completions-${TAG}.zip" \
            --clobber
