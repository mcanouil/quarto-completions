name: Release

on:
  workflow_dispatch:
    inputs:
      quarto:
        type: choice
        description: "Quarto version"
        default: "release"
        options:
          - "release"
          - "pre-release"

permissions:
  contents: read

jobs:
  release:
    uses: mcanouil/quarto-workflows/.github/workflows/release.yml@v2
    permissions:
      contents: write
      pull-requests: write
      pages: write
      id-token: write
    secrets: inherit
    with:
      gh-app-id: ${{ vars.APP_ID }}
      repo-type: project
      quarto: ${{ inputs.quarto || 'release' }}
      notes-header: .github/release-notes.md

  # The completions themselves, so a release can be installed offline or
  # pinned by hand. The installers are unaffected: they always read the
  # published site, never a release asset. Two archives of one tree rather
  # than a file per channel, since every channel holds a file named
  # _quarto. Editing an existing release triggers no further workflow, so
  # the default GITHUB_TOKEN is enough.
  attach-completions:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - name: Checkout the release
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.sha }}

      - name: Attach the completions to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tar -czf "quarto-completions-${TAG}.tar.gz" -C docs completions
          (cd docs && zip -qr "../quarto-completions-${TAG}.zip" completions)
          # --clobber, so re-running this job over a release is not fatal.
          gh release upload "${TAG}" \
            "quarto-completions-${TAG}.tar.gz" \
            "quarto-completions-${TAG}.zip" \
            --clobber
