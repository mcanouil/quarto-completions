name: Generate

on:
  schedule:
    # Weekly, which is often enough for a CLI that changes on release.
    - cron: "30 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generate
  cancel-in-progress: false

jobs:
  # The dev channel needs an actual 99.9.9 source build: that is the version
  # Quarto's own kLocalDevelopment constant reports, and the one build where
  # dev-call and the rest of the hidden surface src/introspect.ts seeds exist
  # to be introspected. Neither the release nor the pre-release binary the
  # generate job installs is that build.
  #
  # Built AND run in a job of its own, with no repository permissions and no
  # persisted checkout credentials: quarto-cli's main is a moving, third-party
  # branch, its configure.sh is arbitrary code, and the binary it produces is
  # exactly as untrusted, since generation runs it once per command in the
  # tree. Neither may run anywhere near this repository's write-capable
  # token, which is why generation happens here rather than in the generate
  # job below: only the completion text this job already produced crosses
  # over, as an artifact, and the generate job never executes anything this
  # job built.
  build-dev-quarto:
    runs-on: ubuntu-latest
    permissions: {}
    # configure.sh builds a moving third-party branch and downloads its own
    # toolchain; a hang here would otherwise run to the default six hours and,
    # since cancel-in-progress is false above, hold the "generate" group and
    # queue every run behind it rather than being replaced by the next one.
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          path: quarto-completions
          persist-credentials: false

      - name: Checkout quarto-cli
        uses: actions/checkout@v7
        with:
          repository: quarto-dev/quarto-cli
          ref: main
          path: quarto-cli
          persist-credentials: false

      - name: Build quarto-cli
        working-directory: quarto-cli
        run: ./configure.sh

      - name: Generate dev completions
        working-directory: quarto-completions
        run: |
          # The checkout above carries whatever dev channel was last
          # committed. Removed first, so a file this run's generator stops
          # producing is gone rather than uploaded as part of a "fresh"
          # artifact, which would smuggle it straight past the generate job's
          # own removal of its previous checkout.
          rm -rf docs/completions/dev
          quarto="${{ github.workspace }}/quarto-cli/package/dist/bin/quarto"
          "${quarto}" run src/generate.ts --channel dev --quarto "${quarto}"

      - name: Upload dev completions
        uses: actions/upload-artifact@v4
        with:
          name: quarto-completions-dev
          path: quarto-completions/docs/completions/dev
          retention-days: 1
          if-no-files-found: error

  generate:
    # Runs even when build-dev-quarto fails: that build is quarto-cli's
    # moving main branch, and one broken commit there must not discard the
    # release and pre-release regeneration below, which does not depend on it.
    # !cancelled() rather than always(): this job can push a branch and open
    # a pull request, which a cancelled run must not still do.
    needs: build-dev-quarto
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # Two Quarto installs and a cold start per command in the tree. A hang here
    # would otherwise run to the default six hours and, since cancel-in-progress
    # is false above, hold the "generate" group and queue every later run behind
    # it rather than being replaced by the next one.
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Git User
        id: setup-git-user
        uses: mcanouil/quarto-workflows/.github/actions/setup-git-user@v1
        with:
          gh-app-id: ${{ vars.APP_ID }}
          app-key: ${{ secrets.APP_KEY }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}

      # Read before the release below overwrites the manifest, so there is
      # something to compare the new release against. Empty on a first run,
      # or one where the file does not parse; either way nothing is archived.
      - name: Record the previous release's minor
        id: previous-release
        run: |
          set -euo pipefail
          version="$(jq -r '.quartoVersion // empty' docs/completions/release/manifest.json 2>/dev/null || true)"
          minor="$(printf '%s' "${version}" | grep -oE '^[0-9]+\.[0-9]+' || true)"
          echo "minor=${minor}" >> "${GITHUB_OUTPUT}"

      - name: Setup Quarto (release)
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: release

      - name: Generate release completions
        run: quarto run src/generate.ts --channel release

      # A minor bump means the line just left is no longer published anywhere
      # once this run's release completions overwrite it, so it is archived
      # under its own channel before that becomes true for good. Ordinary
      # patch releases leave the minor unchanged and archive nothing.
      - name: Archive the superseded release, if the minor moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          previous="${{ steps.previous-release.outputs.minor }}"
          current="$(jq -r '.quartoVersion' docs/completions/release/manifest.json | grep -oE '^[0-9]+\.[0-9]+')"
          if [ -n "${previous}" ] && [ "${previous}" != "${current}" ]; then
            echo "Release moved from ${previous}.x to ${current}.x; archiving ${previous}."
            bash scripts/archive-minor.sh "${previous}"
          else
            echo "Release is still on the ${current}.x line; nothing to archive."
          fi

      # The most recently archived line can still ship a late patch, as 1.9.38
      # did after 1.10 had already reached pre-release. Only the newest
      # archive is worth the weekly check; older ones are frozen on purpose.
      - name: Refresh the newest archived minor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          newest="$(find docs/completions -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | grep -E '^[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          if [ -n "${newest}" ]; then
            echo "Refreshing archived channel ${newest}."
            bash scripts/archive-minor.sh "${newest}"
          else
            echo "No archived minor channel to refresh yet."
          fi

      - name: Setup Quarto (pre-release)
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: pre-release

      - name: Generate pre-release completions
        run: quarto run src/generate.ts --channel pre-release

      - name: Remove the previous dev channel
        if: needs.build-dev-quarto.result == 'success'
        # download-artifact extracts into this directory rather than replacing
        # it, so a file the generator stops producing would otherwise survive
        # from the checkout above, unseen by the git status gate below.
        run: rm -rf docs/completions/dev

      - name: Download dev completions
        if: needs.build-dev-quarto.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: quarto-completions-dev
          path: docs/completions/dev

      - name: Report a failed dev build
        if: needs.build-dev-quarto.result != 'success'
        run: echo "::warning::quarto-cli main failed to build; the dev channel was not regenerated this run."

      - name: Open a pull request when the CLI surface moved
        env:
          GH_TOKEN: ${{ steps.setup-git-user.outputs.token }}
        run: |
          set -euo pipefail

          # The manifest carries a generation date, which changes on every run
          # and says nothing about the CLI surface. Everything else is stable,
          # so no list of artefact names is repeated here. `git status` rather
          # than `git diff`, so a file the generator starts writing under a new
          # name is seen too.
          if [ -z "$(git status --porcelain -- docs/completions ':!docs/completions/*/manifest.json')" ]; then
            echo "Completions are unchanged."
            git checkout -- docs/completions
            exit 0
          fi

          # One fixed branch name: a dated one would open a second pull request
          # beside a first left unmerged for a week, where this force-push
          # updates it in place.
          branch="ci/completions"
          git checkout -b "${branch}"
          git add docs/completions
          git commit -m "chore: regenerate completions from the current Quarto"
          git push --force origin "${branch}"

          # `gh pr view` also reports merged and closed pull requests for the
          # branch, and those must not stop a new one from opening.
          if [ "$(gh pr view "${branch}" --json state --jq .state 2>/dev/null)" = "OPEN" ]; then
            echo "Pull request already open."
            exit 0
          fi

          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "${branch}" \
            --title "chore: regenerate completions from the current Quarto" \
            --body "The Quarto CLI surface changed. Generated by the Generate workflow." \
            --label "Type: CI/CD :robot:"
