name: Generate

on:
  schedule:
    # Weekly, which is often enough for a CLI that changes on release.
    - cron: "30 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Git User
        id: setup-git-user
        uses: mcanouil/quarto-workflows/.github/actions/setup-git-user@v1
        with:
          gh-app-id: ${{ vars.APP_ID }}
          app-key: ${{ secrets.APP_KEY }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Quarto (release)
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: release

      - name: Generate stable completions
        run: quarto run src/generate.ts --channel stable

      - name: Setup Quarto (pre-release)
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: pre-release

      - name: Generate prerelease completions
        run: quarto run src/generate.ts --channel prerelease

      - name: Open a pull request when the CLI surface moved
        env:
          GH_TOKEN: ${{ steps.setup-git-user.outputs.token }}
        run: |
          set -euo pipefail

          # The manifest and the spec carry a generation date, which changes on
          # every run. Only a real change to a completion script is worth a
          # pull request.
          if git diff --quiet -- 'docs/completions/**/quarto.*' 'docs/completions/**/_quarto'; then
            echo "Completions are unchanged."
            git checkout -- docs/completions
            exit 0
          fi

          branch="ci/completions-$(date -u +%Y%m%d)"
          git checkout -b "${branch}"
          git add docs/completions
          git commit -m "chore: regenerate completions from the current Quarto"
          git push --force origin "${branch}"

          if gh pr view "${branch}" >/dev/null 2>&1; then
            echo "Pull request already open."
            exit 0
          fi

          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "${branch}" \
            --title "chore: regenerate completions from the current Quarto" \
            --body "The Quarto CLI surface changed. Generated by the Generate workflow." \
            --label "Type: CI/CD :robot:"
