name: Pages

on:
  pull_request:
    # The reusable workflow skips a draft, and the default activity types fire
    # nothing when a pull request leaves draft, so `ready_for_review` is what
    # runs the render once the draft is lifted.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  # The installers download from the published site, and a normal deploy
  # renders the latest version tag. Without this trigger, the completions the
  # Generate workflow merges each week would stay unreachable until the next
  # release. This deploy renders `main`, so any page change merged since the
  # last tag goes live with it.
  push:
    branches: [main]
    paths:
      - "docs/completions/**"
  workflow_dispatch:
    inputs:
      use-main-as-release:
        type: boolean
        description: "Render from the default branch instead of the latest version tag"
        default: false
      quarto:
        type: choice
        description: "Quarto version"
        default: "release"
        options:
          - "release"
          - "pre-release"

permissions:
  contents: read

jobs:
  pages:
    uses: mcanouil/quarto-workflows/.github/workflows/pages.yml@v2
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      use-main-as-release: ${{ github.event_name == 'push' || inputs.use-main-as-release || false }}
      quarto: ${{ inputs.quarto || 'release' }}
