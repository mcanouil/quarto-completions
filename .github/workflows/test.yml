name: Test

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # The release workflow's `ci/bump-version` pull request touches these two
    # files and nothing else, and neither is read by anything under test, so
    # the matrix runs three times over a tree it has already passed on. Stated
    # as paths rather than as an exemption for the app that opens it: what
    # makes the run pointless is the contents of the diff, not its author, and
    # a pull request that changes one of these alongside real work still runs.
    paths-ignore:
      - "CHANGELOG.md"
      - "CITATION.cff"
  push:
    branches:
      - main
    paths-ignore:
      - "CHANGELOG.md"
      - "CITATION.cff"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    if: ${{ github.event.pull_request.draft != true }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    defaults:
      run:
        # Windows runners provide bash through Git for Windows, which is what
        # the test scripts are written against.
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: release

      # Each test script reports a shell it cannot find as skipped, so the
      # matrix covers the four shells between the three runners rather than
      # demanding all four everywhere.
      - name: Install fish and shell linters
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes fish shellcheck zsh
          curl -fsSL https://github.com/mvdan/sh/releases/download/v3.13.1/shfmt_v3.13.1_linux_amd64 -o /usr/local/bin/shfmt
          echo "fb096c5d1ac6beabbdbaa2874d025badb03ee07929f0c9ff67563ce8c75398b1  /usr/local/bin/shfmt" | sha256sum --check
          chmod +x /usr/local/bin/shfmt

      # fish and nothing else: the linters below are Linux's job, and once the
      # lint step is skipped on macOS nothing on that runner would call them.
      - name: Install fish
        if: runner.os == 'macOS'
        run: brew install fish

      # macOS is in this matrix for two things no other runner offers: bash
      # 3.2.57, where ubuntu and windows both ship bash 5.x, and a BSD
      # userland. Both are reached through tests/completions.sh and
      # tests/install.sh, which are the only steps below that behave
      # differently there. Everything else is skipped on macOS rather than
      # repeated: that runner is three to eight times slower per step than the
      # other two, and a check ubuntu and windows have already made does not
      # become a different check by being made a third time.
      #
      # Nothing left on the macOS runner loads a PowerShell module:
      # Invoke-ScriptAnalyzer is called only from tests/syntax.sh, skipped
      # there below, and tests/completions.sh drives its pwsh case with the
      # preinstalled shell alone.
      - name: Install PSScriptAnalyzer
        if: runner.os != 'macOS'
        shell: pwsh
        run: Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser

      # tests/run.ts imports the emitters and asserts on the strings they
      # return; it starts no shell and reads nothing off the machine, so it
      # cannot answer differently per runner.
      - name: Unit tests
        if: runner.os != 'macOS'
        run: quarto run tests/run.ts

      # Whether the committed scripts still match the current Quarto release is
      # checked by the Generate workflow, which opens a pull request when they
      # do not. Asserting it here would fail every unrelated pull request on the
      # day Quarto ships a release.
      #
      # Every directory under docs/completions is a channel, and the archived
      # minors grow over time, so the loop discovers them rather than naming
      # each one. Only the first gets the full check, per tests/syntax.sh's own
      # comment: the installer and test lints do not read the completions
      # directory, so repeating them per channel would only cost another cold
      # PowerShell start.
      #
      # Skipped on macOS, where the part that would have been worth having is
      # `bash -n` against a generated script under bash 3.2. The Functional
      # completions step below does not merely parse those same scripts there,
      # it sources them and calls the completion function, so a construct
      # bash 3.2 cannot read still fails the macOS job, one step later than it
      # would have here. The shellcheck and shfmt runs alongside it read the
      # committed sources, which are the same bytes on every runner.
      - name: Syntax and lint
        if: runner.os != 'macOS'
        run: |
          set -euo pipefail
          first=1
          for directory in docs/completions/*/; do
            if [ "${first}" = "1" ]; then
              bash tests/syntax.sh "${directory}"
              first=0
            else
              bash tests/syntax.sh "${directory}" --scripts-only
            fi
          done

      # This sources the generated scripts in real bash, zsh, fish, and
      # PowerShell, and the dev channel among them is generated from
      # quarto-cli's main, an unreviewed third-party branch. Command names,
      # flags, and enum values reaching a shell as code rather than as data is
      # exactly what the emitters escape against, with a test per shell in
      # tests/run.ts pinning it. The control is that escaping; what remains is
      # the runner itself, which holds no more than a contents:read token and
      # is discarded after the job.
      - name: Functional completions
        run: |
          bash tests/completions.sh docs/completions/release
          bash tests/completions.sh docs/completions/dev

      - name: Render the site
        run: quarto render docs

      - name: Installer end to end (POSIX shells)
        if: runner.os != 'Windows'
        run: bash tests/install.sh docs/_site

      # windows covers the native case and ubuntu the non-Windows one, which
      # is the pair tests/install.ps1 branches on. macOS would be a second
      # non-Windows run of the same branch, and the slowest step in the matrix
      # at that: PowerShell is the one surface here with no bash 3.2 or BSD
      # dimension for macOS to bring to it.
      - name: Installer end to end (PowerShell)
        if: runner.os != 'macOS'
        shell: pwsh
        run: pwsh -NoProfile -File tests/install.ps1 docs/_site
